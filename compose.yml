services:
  ccdash:
    container_name: ccdash
    image: ghcr.io/dumontchristophe/ccdash:latest
    restart: unless-stopped

    ports:
    - "${CCDASH_BIND:-127.0.0.1}:4318:4318"
    environment:
      CCDASH_ALLOW_HOST: "${CCDASH_ALLOW_HOST:-}"

    volumes:
      - ./data:/data

    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]

    healthcheck:
      test: ["CMD","python3","-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4318/health')"]
      interval: 30s
      timeout: 5s
      retries: 3