name: Release

# Publishes the image to GHCR on a version tag. The package inherits the repo's
# visibility, so while the repo is private the image is private too: pulling it
# needs a `docker login ghcr.io` with a read:packages token.
on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Multi-arch: the build runs amd64 natively and arm64 under emulation, so
      # the manifest serves Apple Silicon hosts as well.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN carries the packages:write granted above; no PAT needed to
      # push from CI.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/<owner>/<repo>, lowercased — follows a repo rename on its own.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The Dockerfile lives at the repo root and COPYs the ccdash/ package, so
      # the repo root is the build context (see .dockerignore).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
