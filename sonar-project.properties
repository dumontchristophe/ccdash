sonar.projectBaseDir=.
sonar.sourceEncoding=UTF-8

# ccdash/ holds the whole product: server.py, api.py, ingest.py, core/ and
# pages/ (backend), web/ (UI). styles/ holds the stylesheet source; Dockerfile
# and compose.yml sit at the repo root. demo/ and docs/ are out of scope
# (unversioned, or the GitHub Pages showcase) and do not appear in sources.
sonar.sources=ccdash,styles
sonar.tests=tests
sonar.test.inclusions=tests/**

# ccdash/web/assets/ccdash.css is the tailwindcss output of styles/input.css: the
# same ~19 KB of rules twice over, and a file CLAUDE.md forbids editing, so an
# issue raised on it could only ever be closed as Won't Fix.
sonar.exclusions=\
  data/**,\
  ccdash/web/assets/ccdash.css,\
  **/__pycache__/**

# 3.12 = the Docker image version, the real deployment target.
sonar.python.version=3.12
